name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build every program
        run: make -j4 all

      - name: Test suites
        run: make test

      - name: Test suites under AddressSanitizer and UBSan
        run: make -j4 asan

      - name: Durability demos
        run: make demos

      - name: Differential test against SQLite
        run: make difftest RUNS=30

      - name: Differential test with a tiny error bound, so rebalancing runs constantly
        run: make difftest RUNS=30 EPS=4

      - name: The same database built on a B+-tree instead of the learned index
        run: make -j4 test-btree && make difftest-btree RUNS=30
